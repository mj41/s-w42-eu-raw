<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack-chan</title>
<style>
  :root {
    --bg: #f4f6ff; --card: #ffffff; --text: #1e2355; --muted: #5a618e;
    --accent: #7d8cff; --accent-text: #ffffff; --soft: #e8ebff; --ok: #1f9d55; --off: #9aa0bd; --border: #dce1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142a; --card: #1c1f3d; --text: #e8eaff; --muted: #a3a8cc;
      --accent: #7d8cff; --accent-text: #0e1030; --soft: #262a52; --ok: #4ade80; --off: #6b7094; --border: #2c3060;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
       margin: 16px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
          padding: 16px; margin-bottom: 12px; }
  .head { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-left: auto; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 4px 0; border-top: 1px solid var(--border); }
  td:last-child { text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.soft { background: var(--soft); color: var(--text); }
  button:disabled { opacity: 0.45; cursor: default; }
  input[type=text] { font: inherit; flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px;
                     border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input[type=color] { width: 48px; height: 40px; border: 1px solid var(--border); border-radius: 10px;
                      background: var(--bg); padding: 2px; }
  .axes { display: grid; gap: 14px; margin-top: 10px; }
  .axis-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .axis-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .axis-row { display: flex; align-items: center; gap: 6px; }
  .axis-row input[type=range] { flex: 1; min-width: 60px; }
  button.chip { flex: none; padding: 8px 0; min-width: 40px; border-radius: 999px; background: var(--soft);
                color: var(--text); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .stats { font-variant-numeric: tabular-nums; }
  .events { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  .events li { padding: 3px 0; border-top: 1px solid var(--border); }
  .status { color: var(--muted); font-size: 0.9rem; min-height: 1.4em; margin-top: 12px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Stack-chan</h1>
  <p class="sub" id="conn">Connecting…</p>
  <div id="robots"></div>
  <p class="empty" id="empty" hidden>
    No robot is paired with this browser yet. Open <b>Embody Mode</b> on the Stack-chan
    and scan the QR code it shows.
  </p>
</main>
<script>
"use strict";
const list = document.getElementById("robots");
const empty = document.getElementById("empty");
const connLine = document.getElementById("conn");
const cards = new Map();     // robot id -> card
const pendingPings = new Map(); // ping id -> {t0, resolve}

const EMOTIONS = ["neutral", "happy", "angry", "sad", "doubt", "sleepy"];
const STICKERS = ["heart", "angry", "sweat", "shy", "dizzy"];

// Scale and crop a picture to the robot screen (320x240) as a baseline JPEG.
async function toJpeg320(file) {
  const bmp = await createImageBitmap(file);
  const canvas = Object.assign(document.createElement("canvas"), { width: 320, height: 240 });
  const scale = Math.max(320 / bmp.width, 240 / bmp.height);
  const w = bmp.width * scale, h = bmp.height * scale;
  canvas.getContext("2d").drawImage(bmp, (320 - w) / 2, (240 - h) / 2, w, h);
  return new Promise((resolve, reject) =>
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("could not encode JPEG"))), "image/jpeg", 0.8));
}
const TELEMETRY_LABELS = {
  battery_pct: ["Battery", "%"], charging: ["Charging", ""], head_yaw_deg: ["Head yaw", "°"],
  head_pitch_deg: ["Head pitch", "°"], wifi_rssi_dbm: ["Wi-Fi", " dBm"], free_heap_kb: ["Free memory", " kB"],
  uptime_s: ["Uptime", " s"], brightness_pct: ["Brightness", "%"], volume_pct: ["Volume", "%"],
  screensaver: ["Screensaver", ""],
};

function el(tag, props = {}, children = []) {
  const e = Object.assign(document.createElement(tag), props);
  for (const c of children) e.append(c);
  return e;
}

function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? s + " s ago" : Math.round(s / 60) + " min ago";
}

async function sendCommand(id, command, args) {
  const res = await fetch("/api/robots/" + encodeURIComponent(id) + "/command", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(args ? { command, args } : { command }),
  });
  if (!res.ok) throw new Error((await res.text()).trim());
}

// ping: browser -> server -> robot -> server -> browser. The server reports its
// own round trip to the robot, so the browser <-> server part is the rest.
async function pingOnce(robotId) {
  const id = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
  const t0 = performance.now();
  const answer = new Promise((resolve, reject) => {
    pendingPings.set(id, { t0, resolve });
    setTimeout(() => { if (pendingPings.delete(id)) reject(new Error("timeout")); }, 3000);
  });
  try {
    await sendCommand(robotId, "ping", { id });
  } catch (err) {
    pendingPings.delete(id);
    throw err;
  }
  return answer;
}

function stat(values) {
  const v = [...values].sort((a, b) => a - b);
  const avg = v.reduce((a, b) => a + b, 0) / v.length;
  return { min: v[0], med: v[Math.floor(v.length / 2)], avg, max: v[v.length - 1] };
}
const ms = (x) => x.toFixed(x < 10 ? 1 : 0) + " ms";

function makeCard(r) {
  const c = { id: r.id, events: [] };
  const has = (cmd) => r.commands.includes(cmd);
  const status = el("div", { className: "status" });
  const say = (text) => { status.textContent = text; };
  const run = async (command, args, label) => {
    try {
      await sendCommand(c.id, command, args);
      say("Sent " + (label || command));
    } catch (err) {
      say("Failed: " + err.message);
    }
  };

  c.dot = el("span", { className: "dot" });
  c.meta = el("span", { className: "meta" });
  c.table = el("table");
  const sections = [
    el("div", { className: "head" }, [c.dot, el("span", { className: "name", textContent: r.id }), c.meta]),
    el("h2", { textContent: "Status" }), c.table,
  ];

  if (has("ping")) {
    c.pingStats = el("div", { className: "stats muted", textContent: "Measures browser → server → robot and back." });
    const btn = el("button", { textContent: "Ping ×10", className: "soft" });
    c.pingBtn = btn;
    btn.onclick = async () => {
      c.pinging = true;
      btn.disabled = true;
      const total = [], robot = [], queue = [];
      let lost = 0;
      for (let i = 0; i < 10; i++) {
        try {
          const p = await pingOnce(c.id);
          total.push(p.total); robot.push(p.server_robot_ms); queue.push(p.robot_queue_ms);
          c.pingStats.textContent = `${total.length}/10 · last ${ms(p.total)}`;
        } catch (err) {
          lost++;
          if (err.message !== "timeout") { say("Ping failed: " + err.message); break; }
        }
        await new Promise((r) => setTimeout(r, 150));
      }
      if (total.length) {
        const t = stat(total), s = stat(robot), q = stat(queue);
        c.pingStats.replaceChildren(
          el("div", { textContent: `Round trip: median ${ms(t.med)} · min ${ms(t.min)} · max ${ms(t.max)}` + (lost ? ` · ${lost} lost` : "") }),
          el("div", { textContent: `Browser ↔ server ≈ ${ms(Math.max(0, t.med - s.med))} · server ↔ robot ${ms(s.med)} · robot loop ${ms(q.med)}` }),
        );
      }
      c.pinging = false;
      btn.disabled = !c.robot.online;
    };
    sections.push(el("h2", { textContent: "Latency" }), el("div", { className: "row" }, [btn]), c.pingStats);
  }

  if (has("emotion") || has("say")) {
    sections.push(el("h2", { textContent: "Face" }));
    if (has("emotion")) {
      sections.push(el("div", { className: "row" }, EMOTIONS.map((name) =>
        el("button", { className: "soft", textContent: name, onclick: () => run("emotion", { name }, name) }))));
    }
    if (has("say")) {
      const input = el("input", { type: "text", placeholder: "Say something…", maxLength: 80 });
      const go = () => { if (input.value.trim()) { run("say", { text: input.value.trim(), seconds: 6 }, "say"); input.value = ""; } };
      input.onkeydown = (e) => { if (e.key === "Enter") go(); };
      sections.push(el("div", { className: "row", style: "margin-top:8px" }, [input, el("button", { textContent: "Say", onclick: go })]));
    }
  }

  // A slider with −/+ chips. It holds the value the user chose ("target") and
  // shows the robot's reported value as "now …"; it follows the robot again
  // only after a few seconds without user input (servos need time to arrive).
  const slider = (label, min, max, key, unit, onValue, { live = false, steps = [], showNow = false } = {}) => {
    const input = el("input", { type: "range", min, max, value: Math.round((min + max) / 2), ariaLabel: label });
    const value = el("span", { className: "axis-value", textContent: input.value + unit });
    const now = el("span", { className: "muted" });
    const s = { input, value, now, unit, touched: 0, showNow };
    let timer = 0;
    const set = (v, send) => {
      v = Math.max(min, Math.min(max, Math.round(v)));
      input.value = v;
      value.textContent = v + unit;
      s.touched = Date.now();
      if (send) { clearTimeout(timer); timer = setTimeout(() => onValue(v), 120); }
    };
    input.oninput = () => set(+input.value, live);
    input.onchange = () => set(+input.value, true);
    const chip = (step) => el("button", { className: "chip", textContent: (step > 0 ? "+" : "−") + Math.abs(step),
      ariaLabel: `${label} ${step > 0 ? "+" : "−"}${Math.abs(step)}${unit}`, onclick: () => set(+input.value + step, true) });
    c.sliders = c.sliders || {};
    c.sliders[key] = s;
    return el("div", { className: "axis" }, [
      el("div", { className: "axis-head" }, [el("span", { textContent: label }), el("span", {}, [value, " ", now])]),
      el("div", { className: "axis-row" }, [
        ...steps.filter((x) => x < 0).map(chip), input, ...steps.filter((x) => x > 0).map(chip),
      ]),
    ]);
  };

  if (has("nod") || has("shake") || has("home") || has("look")) {
    sections.push(el("h2", { textContent: "Head" }));
    sections.push(el("div", { className: "row" }, ["nod", "shake", "home"].filter(has).map((cmd) =>
      el("button", { textContent: cmd, onclick: () => run(cmd) }))));
    if (has("look")) {
      const look = () => run("look", { yaw: +c.sliders.head_yaw_deg.input.value, pitch: +c.sliders.head_pitch_deg.input.value }, "look");
      const head = { live: true, steps: [-15, -5, 5, 15], showNow: true };
      sections.push(el("div", { className: "axes" }, [
        slider("Yaw", -128, 128, "head_yaw_deg", "°", look, head),
        slider("Pitch", 3, 87, "head_pitch_deg", "°", look, head),
      ]));
    }
  }

  if (has("leds")) {
    const left = el("input", { type: "color", value: "#7d8cff" });
    const right = el("input", { type: "color", value: "#ff3d9a" });
    const send = () => run("leds", { left: left.value, right: right.value }, "LEDs");
    left.onchange = send;
    right.onchange = send;
    sections.push(el("h2", { textContent: "LEDs" }), el("div", { className: "row" }, [
      el("span", { className: "muted", textContent: "Left" }), left,
      el("span", { className: "muted", textContent: "Right" }), right,
      el("button", { className: "soft", textContent: "Off", onclick: () => run("leds", { left: "#000000", right: "#000000" }, "LEDs off") }),
    ]));
  }

  if (has("brightness") || has("volume")) {
    sections.push(el("h2", { textContent: "Settings" }));
    const rows = [];
    const setting = { steps: [-10, 10] };
    if (has("brightness")) rows.push(slider("Brightness", 1, 100, "brightness_pct", "%", (v) => run("brightness", { value: v }, "brightness"), setting));
    if (has("volume")) rows.push(slider("Volume", 0, 100, "volume_pct", "%", (v) => run("volume", { value: v }, "volume"), setting));
    sections.push(el("div", { className: "axes" }, rows));
  }

  if (has("sticker") || has("image") || has("face")) {
    sections.push(el("h2", { textContent: "Screen" }));
    if (has("sticker")) {
      sections.push(el("div", { className: "row" }, STICKERS.map((name) =>
        el("button", { className: "soft", textContent: name, onclick: () => run("sticker", { name, seconds: 4 }, name) }))));
    }
    const row = [];
    if (has("image")) {
      const file = el("input", { type: "file", accept: "image/*", hidden: true });
      file.onchange = async () => {
        if (!file.files.length) return;
        try {
          say("Sending picture…");
          const jpeg = await toJpeg320(file.files[0]);
          const res = await fetch("/api/robots/" + encodeURIComponent(c.id) + "/picture", {
            method: "POST", headers: { "Content-Type": "image/jpeg" }, body: jpeg,
          });
          say(res.ok ? `Sent picture (${Math.round(jpeg.size / 1024)} KB)` : "Failed: " + (await res.text()).trim());
        } catch (err) {
          say("Failed: " + err.message);
        }
        file.value = "";
      };
      row.push(file, el("button", { textContent: "Send picture", onclick: () => file.click() }));
    }
    if (has("face")) row.push(el("button", { className: "soft", textContent: "Face", onclick: () => run("face") }));
    if (row.length) sections.push(el("div", { className: "row", style: "margin-top:8px" }, row));
  }

  if (has("camera") || has("mic")) {
    const media = { ws: null, video: false, audio: false, frames: 0, bytes: 0, audioCtx: null, playAt: 0, lastUrl: "" };
    const img = el("img", { alt: "Robot camera", hidden: true,
      style: "width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#000;margin-top:8px" });
    const info = el("div", { className: "muted stats" });
    const watch = el("button", { className: "soft", textContent: "Watch" });
    const listen = el("button", { className: "soft", textContent: "Listen" });

    // Audio message: uint16 LE sample rate, then s16le mono PCM.
    const playPcm = (u8) => {
      const rate = u8[0] | (u8[1] << 8);
      const pcm = new Int16Array(u8.slice(2).buffer);  // copy: Int16Array needs 2-byte alignment
      if (!rate || !pcm.length) return;
      const buf = media.audioCtx.createBuffer(1, pcm.length, rate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
      const src = media.audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(media.audioCtx.destination);
      const now = media.audioCtx.currentTime;
      // ~100 ms jitter buffer; resync when starved or when lagging too far behind
      if (media.playAt < now + 0.02 || media.playAt > now + 0.6) media.playAt = now + 0.1;
      src.start(media.playAt);
      media.playAt += buf.duration;
    };

    const reopen = () => {
      if (media.ws) { media.ws.onclose = null; media.ws.close(); media.ws = null; }
      watch.textContent = media.video ? "Stop video" : "Watch";
      listen.textContent = media.audio ? "Stop audio" : "Listen";
      img.hidden = !media.video;
      if (!media.video && !media.audio) { info.textContent = ""; return; }
      const q = `video=${media.video ? 1 : 0}&audio=${media.audio ? 1 : 0}`;
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/robots/${encodeURIComponent(c.id)}/media?${q}`);
      ws.binaryType = "arraybuffer";
      ws.onmessage = (ev) => {
        const u8 = new Uint8Array(ev.data);
        media.bytes += u8.length;
        if (u8[0] === 0x01) {
          media.frames++;
          const url = URL.createObjectURL(new Blob([u8.subarray(1)], { type: "image/jpeg" }));
          img.src = url;
          if (media.lastUrl) URL.revokeObjectURL(media.lastUrl);
          media.lastUrl = url;
        } else if (u8[0] === 0x02 && media.audioCtx) {
          playPcm(u8.subarray(1));
        }
      };
      ws.onclose = () => { if (media.ws === ws) { info.textContent = "Media stream closed"; } };
      media.ws = ws;
      info.textContent = "Waiting for the robot…";
    };
    watch.onclick = () => { media.video = !media.video; reopen(); };
    listen.onclick = () => {
      media.audio = !media.audio;
      if (media.audio && !media.audioCtx) media.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (media.audioCtx) media.audioCtx.resume();
      reopen();
    };
    setInterval(() => {
      if (media.ws) info.textContent = `${media.video ? media.frames + " fps · " : ""}${Math.round(media.bytes / 1024)} KB/s`;
      media.frames = 0;
      media.bytes = 0;
    }, 1000);
    sections.push(el("h2", { textContent: "Camera & mic" }),
      el("div", { className: "row" }, [has("camera") && watch, has("mic") && listen].filter(Boolean)), img, info);
  }

  c.eventList = el("ul", { className: "events" });
  sections.push(el("h2", { textContent: "Events" }), c.eventList, status);
  c.root = el("section", { className: "card" }, sections);

  c.update = (r) => {
    c.dot.className = "dot" + (r.online ? " on" : "");
    c.meta.textContent = (r.online ? "online" : "offline, seen " + ago(r.last_seen)) + (r.model ? " · " + r.model : "");
    const keys = Object.keys(r.telemetry).sort();
    c.table.replaceChildren(...(keys.length ? keys.map((k) => {
      const [label, unit] = TELEMETRY_LABELS[k] || [k, ""];
      const v = k === "charging" || k === "screensaver" ? (r.telemetry[k] ? "yes" : "no") : r.telemetry[k] + unit;
      return el("tr", {}, [el("td", { textContent: label }), el("td", { textContent: v })]);
    }) : [el("tr", {}, [el("td", { className: "empty", textContent: "No telemetry yet." })])]));
    // Show the robot's reported value; follow it only when the user hasn't
    // touched the slider for a while, so it doesn't jump back mid-move.
    for (const [key, s] of Object.entries(c.sliders || {})) {
      if (!(key in r.telemetry)) continue;
      const reported = Math.round(r.telemetry[key]);
      if (s.showNow) s.now.textContent = `· now ${reported}${s.unit}`;
      if (Date.now() - s.touched > 4000) {
        s.input.value = reported;
        s.value.textContent = reported + s.unit;
      }
    }
    c.root.querySelectorAll("button, input").forEach((e) => { e.disabled = !r.online; });
    if (c.pingBtn) c.pingBtn.disabled = !r.online || c.pinging;
  };
  c.addEvent = (ev) => {
    const where = ev.data && "x" in ev.data ? ` (${ev.data.x}, ${ev.data.y})` : "";
    c.events.unshift(new Date(ev.ts).toLocaleTimeString() + "  " + ev.name.replaceAll("_", " ") + where);
    c.events.length = Math.min(c.events.length, 8);
    c.eventList.replaceChildren(...c.events.map((t) => el("li", { textContent: t })));
  };
  return c;
}

function upsert(r) {
  let c = cards.get(r.id);
  if (!c) {
    c = makeCard(r);
    cards.set(r.id, c);
    const ids = [...cards.keys()].sort();
    list.replaceChildren(...ids.map((id) => cards.get(id).root));
  }
  c.robot = r;
  c.update(r);
  empty.hidden = cards.size > 0;
}

function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("open", () => { connLine.textContent = "Live"; });
  es.addEventListener("robot", (ev) => upsert(JSON.parse(ev.data)));
  es.addEventListener("pong", (ev) => {
    const p = JSON.parse(ev.data);
    const pending = pendingPings.get(p.id);
    if (pending) {
      pendingPings.delete(p.id);
      pending.resolve({ ...p, total: performance.now() - pending.t0 });
    }
  });
  es.addEventListener("robot_event", (ev) => {
    const e = JSON.parse(ev.data);
    const c = cards.get(e.robot);
    if (c) c.addEvent(e);
  });
  es.addEventListener("error", () => { connLine.textContent = "Reconnecting…"; });
}

empty.hidden = false;
connect();
// Refresh "seen … ago" for offline robots.
setInterval(() => { for (const c of cards.values()) if (c.robot && !c.robot.online) c.update(c.robot); }, 5000);
</script>
</body>
</html>
