<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack-chan</title>
<style>
  :root {
    --bg: #f4f6ff; --card: #ffffff; --text: #1e2355; --muted: #5a618e;
    --accent: #7d8cff; --accent-text: #ffffff; --soft: #e8ebff; --ok: #1f9d55; --off: #9aa0bd; --border: #dce1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142a; --card: #1c1f3d; --text: #e8eaff; --muted: #a3a8cc;
      --accent: #7d8cff; --accent-text: #0e1030; --soft: #262a52; --ok: #4ade80; --off: #6b7094; --border: #2c3060;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
       margin: 16px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
          padding: 16px; margin-bottom: 12px; }
  .head { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-left: auto; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 4px 0; border-top: 1px solid var(--border); }
  td:last-child { text-align: right; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.soft { background: var(--soft); color: var(--text); }
  button:disabled { opacity: 0.45; cursor: default; }
  input[type=text] { font: inherit; flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px;
                     border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .row.pixels { margin-top: 8px; gap: 6px; }
  input.code { width: 72px; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
               background: var(--bg); color: var(--text); }
  .irsaved { display: inline-flex; gap: 2px; }
  .row.emojis { gap: 6px; }
  .row.emojis button { padding: 6px; line-height: 0; }
  .row.emojis img { width: 32px; height: 32px; }
  input[type=color].pixel { width: 36px; height: 32px; }
  input[type=color] { width: 48px; height: 40px; border: 1px solid var(--border); border-radius: 10px;
                      background: var(--bg); padding: 2px; }
  .axes { display: grid; gap: 14px; margin-top: 10px; }
  .axis-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .axis-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .axis-row { display: flex; align-items: center; gap: 6px; }
  .axis-row input[type=range] { flex: 1; min-width: 60px; }
  button.chip { flex: none; padding: 8px 0; min-width: 40px; border-radius: 999px; background: var(--soft);
                color: var(--text); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .stats { font-variant-numeric: tabular-nums; }
  .events { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  .events li { padding: 3px 0; border-top: 1px solid var(--border); }
  .events li.sent { color: var(--muted); }
  .eventshead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .eventshead h2 { margin-bottom: 8px; }
  .eventshead select { padding: 4px 8px; font-size: 0.85rem; }
  .status { color: var(--muted); font-size: 0.9rem; min-height: 1.4em; margin-top: 12px; }
  .empty { color: var(--muted); }
  .joinreq { background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .joincode { font: 600 1.3rem ui-monospace, monospace; letter-spacing: 0.06em; color: var(--text); }
  select.select { font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
                  background: var(--bg); color: var(--text); }
  label.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 0.9rem; }
  label.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
</style>
</head>
<body>
<main>
  <h1>Stack-chan</h1>
  <p class="sub" id="conn">Connecting…</p>
  <div id="joins"></div>
  <div id="robots"></div>
  <div class="empty" id="empty" hidden>
    <p>No robot is paired with this browser yet. Open <b>Embody Mode</b> on the Stack-chan
    and scan the QR code it shows, or:</p>
    <div class="row">
      <button id="join">Ask a paired phone</button>
      <span id="joinStatus"></span>
    </div>
    <form id="codeForm" class="row" style="margin-top:12px">
      <input id="codeInput" class="code" style="width:130px" placeholder="Robot code" autocomplete="off" aria-label="Robot code">
      <button class="soft">Pair with code</button>
    </form>
    <p style="font-size:0.85rem">The robot code is the 8 characters under the QR code on its screen
    (long-press the screen to show the QR again).</p>
  </div>
</main>
<script>
"use strict";
const list = document.getElementById("robots");
const empty = document.getElementById("empty");
const connLine = document.getElementById("conn");
const cards = new Map();     // robot id -> card
const pendingPings = new Map(); // ping id -> {t0, resolve}
// A sent command as a short line for the Events list.
function describeCommand(cmd, a) {
  a = a || {};
  let text;
  switch (cmd) {
    case "ir_send":
      text = "IR " + (a.raw ? `raw (${String(a.raw).split(",").length} timings)` : `NEC ${hex(a.address || 0)} / ${hex(a.command || 0)}`) +
        (a.frames > 1 ? ` · ${a.frames}×` : "") + (a.repeat ? ` · hold ×${a.repeat}` : "") + (a.loopback ? " · self-test" : "");
      break;
    case "look": text = `look yaw ${a.yaw}° pitch ${a.pitch}°`; break;
    case "leds": text = "LEDs " + (a.effect || (a.pixels ? "single LEDs" : [a.left, a.right].filter(Boolean).join(" "))); break;
    case "say": text = `say “${a.text || ""}”`; break;
    case "picture": text = `picture (${Math.round((a.bytes || 0) / 1024)} KB)`; break;
    default:
      text = cmd.replaceAll("_", " ") + " " +
        Object.entries(a).map(([k, v]) => `${k} ${typeof v === "object" ? JSON.stringify(v) : v}`).join(", ");
  }
  text = text.trim();
  return text.length > 80 ? text.slice(0, 79) + "…" : text;
}
const hex = (n) => "0x" + Number(n).toString(16).toUpperCase().padStart(2, "0");
const serverInfo = fetch("/api/info").then((r) => r.json()).catch(() => ({})); // {https_url?}

const EMOTIONS = ["neutral", "happy", "angry", "sad", "doubt", "sleepy"];
const STICKERS = ["heart", "angry", "sweat", "shy", "dizzy"];
// Fluent Emoji Flat (MIT, © Microsoft), served from /emoji/<name>.svg.
const EMOJIS = ["smile", "grin", "laugh", "wink", "love", "cool", "surprised", "thinking", "sleepy", "cry", "sob", "angry"];

// Scale and crop a picture to the robot screen (320x240) as a baseline JPEG.
async function toJpeg320(file) {
  const bmp = await createImageBitmap(file);
  const canvas = Object.assign(document.createElement("canvas"), { width: 320, height: 240 });
  const scale = Math.max(320 / bmp.width, 240 / bmp.height);
  const w = bmp.width * scale, h = bmp.height * scale;
  canvas.getContext("2d").drawImage(bmp, (320 - w) / 2, (240 - h) / 2, w, h);
  return new Promise((resolve, reject) =>
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("could not encode JPEG"))), "image/jpeg", 0.8));
}

// An emoji drawn large in the middle of a black 320x240 JPEG.
async function emojiJpeg(name) {
  // The files say 32x32; enlarge them first so the browser rasterizes the vectors at full size.
  const svg = (await (await fetch("/emoji/" + name + ".svg")).text()).replace('width="32" height="32"', 'width="200" height="200"');
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const canvas = Object.assign(document.createElement("canvas"), { width: 320, height: 240 });
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, 320, 240);
    ctx.drawImage(img, 60, 20, 200, 200);
    return await new Promise((resolve, reject) =>
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("could not encode JPEG"))), "image/jpeg", 0.9));
  } finally {
    URL.revokeObjectURL(url);
  }
}
const TELEMETRY_LABELS = {
  battery_pct: ["Battery", "%"], charging: ["Charging", ""], head_yaw_deg: ["Head yaw", "°"],
  head_pitch_deg: ["Head pitch", "°"], wifi_rssi_dbm: ["Wi-Fi", " dBm"], free_heap_kb: ["Free memory", " kB"],
  uptime_s: ["Uptime", " s"], brightness_pct: ["Brightness", "%"], volume_pct: ["Volume", "%"],
  screensaver: ["Screensaver", ""], hold_s: ["Head hold", " s left"],
};
// Shown in their own table, in this order.
const SENSOR_LABELS = {
  imu_ax_g: ["Accel X", " g"], imu_ay_g: ["Accel Y", " g"], imu_az_g: ["Accel Z", " g"], imu_gyro_dps: ["Rotation", " °/s"],
  mag_x_ut: ["Magnetic X", " µT"], mag_y_ut: ["Magnetic Y", " µT"], mag_z_ut: ["Magnetic Z", " µT"],
  mag_raw_x: ["Magnetic X (raw)", ""], mag_raw_y: ["Magnetic Y (raw)", ""], mag_raw_z: ["Magnetic Z (raw)", ""],
  mag_rhall: ["Magnetometer hall (raw)", ""],
  yaw_load_pct: ["Yaw servo load", "%"], pitch_load_pct: ["Pitch servo load", "%"],
  yaw_temp_c: ["Yaw servo temp", " °C"], pitch_temp_c: ["Pitch servo temp", " °C"],
  servo_voltage_v: ["Servo supply", " V"], chip_temp_c: ["Chip temp", " °C"],
  yaw_pos_raw: ["Yaw position (raw 0–1000)", ""], yaw_speed_raw: ["Yaw speed (raw)", ""], yaw_current_raw: ["Yaw current (raw)", ""],
  yaw_moving: ["Yaw moving", ""], pitch_voltage_v: ["Pitch servo supply", " V"], pitch_pos_raw: ["Pitch position (raw 0–1000)", ""],
  pitch_speed_raw: ["Pitch speed (raw)", ""], pitch_current_raw: ["Pitch current (raw)", ""], pitch_moving: ["Pitch moving", ""],
  light_ch0: ["Light CH0 (raw, visible+IR)", ""], light_ch1: ["Light CH1 (raw, IR)", ""],
  rtc_unix: ["RTC clock", ""], system_unix: ["System clock", ""], pmic_ts_raw: ["Battery TS pin (raw)", ""],
  servo_power: ["Servo power", ""], rotate_s: ["Rotating", " s left"],
  head_zone0: ["Head zone 0", " (0–3)"], head_zone1: ["Head zone 1", " (0–3)"], head_zone2: ["Head zone 2", " (0–3)"],
  light_lux: ["Light", " lux"], proximity: ["Proximity", " (0–2047)"],
  body_battery_v: ["Body battery", " V"], body_current_ma: ["Body current (+ draw, − charge)", " mA"], body_power_mw: ["Body power (+ draw)", " mW"],
  body_shunt_uv: ["Body shunt (raw)", " µV"],
  usb_data: ["Computer on CoreS3 USB", ""],
  core_battery_v: ["Core battery", " V"], core_vbus_v: ["USB input", " V"], core_system_v: ["Core system", " V"],
  core_charge: ["Core charge", ""], core_charge_phase: ["Charge phase", ""], pmic_temp_c: ["Power chip temp", " °C"],
  pmic_status1: ["PMIC status 1 (raw)", ""], pmic_status2: ["PMIC status 2 (raw)", ""],
};
// Values shown as words instead of numbers.
const SENSOR_FORMAT = {
  core_charge: (v) => ["idle", "charging", "discharging"][v] ?? v,
  core_charge_phase: (v) => ["trickle", "pre-charge", "constant current", "constant voltage", "done", "not charging"][v] ?? v,
  pmic_status1: (v) => hex(v), pmic_status2: (v) => hex(v),
  usb_data: (v) => (v ? "yes" : "no"),
  yaw_moving: (v) => (v ? "yes" : "no"), pitch_moving: (v) => (v ? "yes" : "no"),
  servo_power: (v) => (v ? "on" : "off"),
  rtc_unix: (v) => new Date(v * 1000).toLocaleString(), system_unix: (v) => new Date(v * 1000).toLocaleString(),
};

function el(tag, props = {}, children = []) {
  const e = Object.assign(document.createElement(tag), props);
  for (const c of children) e.append(c);
  return e;
}

function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? s + " s ago" : Math.round(s / 60) + " min ago";
}

async function sendCommand(id, command, args) {
  const res = await fetch("/api/robots/" + encodeURIComponent(id) + "/command", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(args ? { command, args } : { command }),
  });
  if (!res.ok) throw new Error((await res.text()).trim());
}

// ping: browser -> server -> robot -> server -> browser. The server reports its
// own round trip to the robot, so the browser <-> server part is the rest.
async function pingOnce(robotId) {
  const id = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
  const t0 = performance.now();
  const answer = new Promise((resolve, reject) => {
    pendingPings.set(id, { t0, resolve });
    setTimeout(() => { if (pendingPings.delete(id)) reject(new Error("timeout")); }, 3000);
  });
  try {
    await sendCommand(robotId, "ping", { id });
  } catch (err) {
    pendingPings.delete(id);
    throw err;
  }
  return answer;
}

function stat(values) {
  const v = [...values].sort((a, b) => a - b);
  const avg = v.reduce((a, b) => a + b, 0) / v.length;
  return { min: v[0], med: v[Math.floor(v.length / 2)], avg, max: v[v.length - 1] };
}
const ms = (x) => x.toFixed(x < 10 ? 1 : 0) + " ms";

function makeCard(r) {
  const c = { id: r.id, events: [], seen: new Set() };
  const has = (cmd) => r.commands.includes(cmd);
  const status = el("div", { className: "status" });
  const say = (text) => { status.textContent = text; };
  // Default browser behaviour: every command (and a picture) also wakes a blank
  // screen. The robot itself keeps a manual blank until told otherwise; the
  // "Commands wake the screen" box turns this off. Ping is only a measurement.
  const NO_WAKE = new Set(["ping", "screensaver", "standby"]);
  c.wakeOnCommand = el("input", { type: "checkbox", checked: true });
  const wakeIfBlank = () => {
    if (has("screensaver") && c.wakeOnCommand.checked && c.blank) {
      c.blank = false; // don't send twice before the robot reports back
      sendCommand(c.id, "screensaver", { on: false }).catch(() => {});
    }
  };
  const run = async (command, args, label) => {
    try {
      await sendCommand(c.id, command, args);
      say("Sent " + (label || command));
      if (!NO_WAKE.has(command)) wakeIfBlank();
      return true;
    } catch (err) {
      say("Failed: " + err.message);
      return false;
    }
  };

  c.dot = el("span", { className: "dot" });
  c.meta = el("span", { className: "meta" });
  c.table = el("table");
  const sections = [
    el("div", { className: "head" }, [c.dot, el("span", { className: "name", textContent: r.id }), c.meta]),
    el("h2", { textContent: "Status" }), c.table,
    el("div", { className: "eventshead" }, [el("h2", { textContent: "Events" }), (c.eventFilter = el("select",
      { className: "select", ariaLabel: "Which events to show" },
      [["all", "All"], ["robot", "Robot only"], ["sent", "Sent only"]].map(([v, t]) => el("option", { value: v, textContent: t }))))]),
    (c.eventList = el("ul", { className: "events" })),
    (c.sensorHead = el("h2", { textContent: "Sensors", hidden: true })), (c.sensorTable = el("table", { hidden: true })),
    (c.imuBox = el("div")),
  ];

  if (has("imu_stream")) {
    // Raw IMU at 100 Hz over a media socket (imu=1): the server turns the robot's stream on
    // while at least one browser has it open. Keeps up to 60 s for a CSV download.
    const imu = { ws: null, samples: [], count: 0, last: null };
    const live = el("button", { className: "soft", textContent: "Live IMU (100 Hz)" });
    const csv = el("button", { className: "soft", textContent: "Download CSV", disabled: true });
    csv.dataset.alwaysDisabled = "1";
    const out = el("div", { className: "muted stats", style: "white-space:pre-wrap" });
    const stop = () => {
      if (imu.ws) { imu.ws.onclose = null; imu.ws.close(); imu.ws = null; }
      live.textContent = "Live IMU (100 Hz)";
    };
    live.onclick = () => {
      if (imu.ws) { stop(); return; }
      imu.samples = [];
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/robots/${encodeURIComponent(c.id)}/media?imu=1`);
      ws.binaryType = "arraybuffer";
      ws.onmessage = (ev) => {
        const dv = new DataView(ev.data);
        if (dv.getUint8(0) !== 0x05) return;
        const n = dv.getUint16(1, true);
        for (let i = 0; i < n; i++) {
          const o = 3 + i * 40, s = [dv.getUint32(o, true)];
          for (let k = 0; k < 9; k++) s.push(dv.getFloat32(o + 4 + k * 4, true));
          imu.samples.push(s);
          imu.last = s;
        }
        imu.count += n;
        if (imu.samples.length > 6000) imu.samples.splice(0, imu.samples.length - 6000);
        csv.disabled = false;
        delete csv.dataset.alwaysDisabled;
      };
      ws.onclose = () => { if (imu.ws === ws) { imu.ws = null; live.textContent = "Live IMU (100 Hz)"; } };
      imu.ws = ws;
      live.textContent = "Stop live IMU";
    };
    csv.onclick = () => {
      const rows = ["t_ms,ax_mps2,ay_mps2,az_mps2,gx_dps,gy_dps,gz_dps,mx_ut,my_ut,mz_ut", ...imu.samples.map((s) => s.join(","))];
      const a = el("a", { href: URL.createObjectURL(new Blob([rows.join("\n")], { type: "text/csv" })), download: `${c.id}-imu.csv` });
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    setInterval(() => {
      if (!imu.ws) return;
      const s = imu.last, f = (v) => v.toFixed(2).padStart(7);
      out.textContent = `${imu.count} samples/s · ${imu.samples.length} kept` + (s ? `\naccel ${f(s[1])} ${f(s[2])} ${f(s[3])} m/s²\ngyro  ${f(s[4])} ${f(s[5])} ${f(s[6])} °/s\nmag   ${f(s[7])} ${f(s[8])} ${f(s[9])} µT` : "");
      imu.count = 0;
    }, 1000);
    c.imuBox.replaceChildren(el("div", { className: "row", style: "margin-top:8px" }, [live, csv]), out);
  }
  if (has("touch_stream")) {
    // Raw touch points (both fingers, 50 Hz) over a media socket (touch=1), drawn at half size.
    const tl = { ws: null, frames: 0 };
    const btn = el("button", { className: "soft", textContent: "Live touch" });
    const canvas = el("canvas", { width: 160, height: 120, hidden: true,
      style: "display:block;margin-top:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg)" });
    const txt = el("div", { className: "muted stats" });
    const draw = (pts) => {
      const g = canvas.getContext("2d");
      g.clearRect(0, 0, 160, 120);
      pts.forEach(([id, x, y]) => {
        g.fillStyle = id ? "#ff3d9a" : "#7d8cff";
        g.beginPath(); g.arc(x / 2, y / 2, 7, 0, 2 * Math.PI); g.fill();
      });
      txt.textContent = pts.length ? pts.map(([id, x, y]) => `#${id} ${x},${y}`).join("  ") : "no finger";
    };
    btn.onclick = () => {
      if (tl.ws) { tl.ws.onclose = null; tl.ws.close(); tl.ws = null; btn.textContent = "Live touch"; canvas.hidden = true; txt.textContent = ""; return; }
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/robots/${encodeURIComponent(c.id)}/media?touch=1`);
      ws.binaryType = "arraybuffer";
      ws.onmessage = (ev) => {
        const dv = new DataView(ev.data);
        if (dv.getUint8(0) !== 0x06) return;
        let o = 3, pts = [];
        for (let f = dv.getUint16(1, true); f > 0; f--) {
          const n = dv.getUint8(o + 4); o += 5; pts = [];
          for (let i = 0; i < n; i++, o += 5) pts.push([dv.getUint8(o), dv.getUint16(o + 1, true), dv.getUint16(o + 3, true)]);
        }
        draw(pts); // the newest frame
      };
      ws.onclose = () => { if (tl.ws === ws) { tl.ws = null; btn.textContent = "Live touch"; } };
      tl.ws = ws;
      btn.textContent = "Stop live touch";
      canvas.hidden = false;
    };
    c.imuBox.append(el("div", { className: "row", style: "margin-top:8px" }, [btn]), canvas, txt);
  }
  if (has("light_stream")) {
    // Raw proximity and light (20 samples/s) over a media socket (light=1): the last 10 s
    // as lines (proximity blue, light CH0 orange, CH1 red), each scaled to its own range.
    const ls = { ws: null, samples: [], count: 0 };
    const btn = el("button", { className: "soft", textContent: "Live light & proximity" });
    const canvas = el("canvas", { width: 320, height: 90, hidden: true,
      style: "display:block;margin-top:8px;max-width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg)" });
    const txt = el("div", { className: "muted stats" });
    const draw = () => {
      const g = canvas.getContext("2d"), pts = ls.samples;
      g.clearRect(0, 0, 320, 90);
      [[1, "#3f7be0"], [2, "#f5a300"], [3, "#e53935"]].forEach(([k, color]) => {
        const vals = pts.map((p) => p[k]), lo = Math.min(...vals), hi = Math.max(...vals, lo + 1);
        g.strokeStyle = color; g.lineWidth = 1.5; g.beginPath();
        vals.forEach((v, i) => { const x = (i / 199) * 320, y = 84 - ((v - lo) / (hi - lo)) * 78; i ? g.lineTo(x, y) : g.moveTo(x, y); });
        g.stroke();
      });
    };
    const stop = () => {
      if (ls.ws) { ls.ws.onclose = null; ls.ws.close(); ls.ws = null; }
      btn.textContent = "Live light & proximity"; canvas.hidden = true; txt.textContent = "";
    };
    btn.onclick = () => {
      if (ls.ws) { stop(); return; }
      ls.samples = [];

      ws.binaryType = "arraybuffer";
      ws.onmessage = (ev) => {
        const dv = new DataView(ev.data);
        if (dv.getUint8(0) !== 0x08) return;
        const n = dv.getUint16(1, true);
        for (let i = 0, o = 3; i < n; i++, o += 10) {
          ls.samples.push([dv.getUint32(o, true), dv.getUint16(o + 4, true), dv.getUint16(o + 6, true), dv.getUint16(o + 8, true)]);
        }
        ls.count += n;
        if (ls.samples.length > 200) ls.samples.splice(0, ls.samples.length - 200);
        draw();
      };
      ws.onclose = () => { if (ls.ws === ws) stop(); };
      ls.ws = ws;
      btn.textContent = "Stop live light";
      canvas.hidden = false;
    };

      if (!ls.ws) return;
      const s = ls.samples[ls.samples.length - 1];
      txt.textContent = `${ls.count} samples/s` + (s ? ` · proximity ${s[1]} · light CH0 ${s[2]} · CH1 ${s[3]}` : "");

    }, 1000);

  if (has("screensaver") || has("standby")) {

  if (has("nfc")) {

  if (has("ping")) {

      v = Math.max(min, Math.min(max, Math.round(v)));

        el("button", { className: "soft", textContent: "Send", onclick: () => irSend(necCode(), "IR NEC") }), hold,
        el("label", { className: "check muted", style: "margin-top:0", title: "Sends the whole code 3 times, 108 ms apart. A button that toggles may toggle twice." },
          [thrice, "Send 3×"]),

        // The robot sends NEC 0xEE/0x11 and listens for its own reflection: proves carrier and timing.

      const sendPicture = async (makeJpeg, label) => {
        try {

          const jpeg = await makeJpeg();
          const res = await fetch("/api/robots/" + encodeURIComponent(c.id) + "/picture", {
            method: "POST", headers: { "Content-Type": "image/jpeg" }, body: jpeg,

  if (has("camera") || has("mic")) {
    const media = { ws: null, video: false, audio: false, frames: 0, bytes: 0, audioCtx: null, playAt: 0, lastUrl: "",

    const info = el("div", { className: "muted stats" });
    const watch = el("button", { className: "soft", textContent: "Watch" });
    const listen = el("button", { className: "soft", textContent: "Listen" });

    // Audio message: uint16 LE sample rate, then s16le mono PCM.
    // Audio: 0x02 = rate + mono PCM; 0x04 = rate + channel count + interleaved PCM of
    // all codec channels: 1 is the microphone, 0 the speaker reference (what the robot
    // plays, looped back for echo cancellation). Pick which one to hear.
    const chanSel = el("select", { className: "select", ariaLabel: "Microphone channel", hidden: true },
      [["1", "Microphone"], ["0", "Speaker reference"]].map(([v, t]) => el("option", { value: v, textContent: t })));

      const rate = u8[0] | (u8[1] << 8);

      if (!rate || !pcm.length) return;
      const frames = Math.floor(pcm.length / channels);
      const stereo = false; // "both" was only useful for telling the channels apart

    };

    const reopen = () => {
      if (media.ws) { media.ws.onclose = null; media.ws.close(); media.ws = null; }
      watch.textContent = media.video ? "Stop video" : "Watch";
      listen.textContent = media.audio ? "Stop audio" : "Listen";
      img.hidden = !media.video;
      if (!media.video && !media.audio) { info.textContent = ""; return; }
      const q = `video=${media.video ? 1 : 0}&audio=${media.audio ? 1 : 0}`;
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/robots/${encodeURIComponent(c.id)}/media?${q}`);
      ws.binaryType = "arraybuffer";
      ws.onmessage = (ev) => {
        const u8 = new Uint8Array(ev.data);

          media.lastVideoAt = Date.now();

        } else if (u8[0] === 0x02 && media.audioCtx) {
          media.lastAudioAt = Date.now();
          playPcm(u8.subarray(1));
        } else if (u8[0] === 0x04 && media.audioCtx) {

      // reconnect while video or audio is still wanted.

        setTimeout(() => { if (media.ws === ws) reopen(); }, 2000);
      };
      media.ws = ws;
      media.openedAt = media.lastVideoAt = media.lastAudioAt = Date.now();

      if (media.audio && media.audioCtx && media.audioCtx.state !== "running") media.audioCtx.resume().catch(() => {});

        if (media.audio && media.audioCtx && media.audioCtx.state !== "running") notes.push(`audio ${media.audioCtx.state}: tap here`);

      media.bytes = 0;
    }, 1000);
    sections.push(el("h2", { textContent: "Camera & mic" }),
      el("div", { className: "row" }, [has("camera") && watch, has("mic") && listen, chanSel].filter(Boolean)), img, info);
    if (has("snapshot")) {
      // Full-resolution still: the robot switches the sensor to 640x480 for one frame.
      const shot = el("img", { alt: "Robot snapshot", hidden: true, style: "width:100%;border-radius:10px;margin-top:8px" });
      const link = el("a", { textContent: "Download", hidden: true });
      c.onSnapshot = (e) => {
        const url = `/api/robots/${encodeURIComponent(c.id)}/snapshot?t=${Date.parse(e.ts) || Date.now()}`;
        shot.src = url;
        shot.hidden = false;
        link.href = url;
        link.download = `${c.id}-${(e.ts || "").replace(/[:.]/g, "-")}.jpg`;
        link.hidden = false;
        say(`Snapshot ${Math.round(e.bytes / 1024)} KB`);
      };
      sections.push(el("div", { className: "row", style: "margin-top:8px" }, [
        el("button", { className: "soft", textContent: "Snapshot 640×480", onclick: () => run("snapshot", {}, "snapshot (takes a second)") }), link,
      ]), shot);
    }
    if (has("camera_config")) {
      const mirror = el("input", { type: "checkbox" }), flip = el("input", { type: "checkbox" });
      mirror.onchange = () => run("camera_config", { mirror: mirror.checked }, "camera mirror " + (mirror.checked ? "on" : "off"));
      flip.onchange = () => run("camera_config", { flip: flip.checked }, "camera flip " + (flip.checked ? "on" : "off"));
      sections.push(el("div", { className: "row", style: "margin-top:4px" }, [
        el("label", { className: "check muted", style: "margin-top:0" }, [mirror, "Mirror"]),
        el("label", { className: "check muted", style: "margin-top:0" }, [flip, "Flip"]),
      ]));
    }

      const reg = el("input", { className: "code", value: "0x03", ariaLabel: "Sensor register" });
      const val = el("input", { className: "code", placeholder: "value", ariaLabel: "Register value" });
      sections.push(el("div", { className: "row", style: "margin-top:8px" }, [
        el("span", { className: "muted", textContent: "Sensor register" }), reg, val,
        el("button", { className: "soft", textContent: "Read", onclick: () => run("camera_reg", { reg: Number(reg.value) }, "read register") }),
        el("button", { className: "soft", textContent: "Write", onclick: () => {

  // Right below the camera, to steer the head while watching.

    if (has("look")) {

        el("span", { className: "muted", textContent: "Hold position" }), holdSel,

      sections.push(el("div", { className: "row", style: "margin-top:8px" }, [
        el("span", { className: "muted", textContent: "Servo power" }),
        el("button", { className: "soft", textContent: "On", onclick: () => run("servo_power", { on: true }, "servo power on") }),

        [["3", "3 s"], ["10", "10 s"], ["30", "30 s"]].map(([v, t]) => el("option", { value: v, textContent: t })));

        if (!noCable.checked) { say("Tick “No cable in the head” first"); return; }

        el("span", { className: "muted", textContent: "Rotate" }),
        el("button", { className: "soft", textContent: "⟲", ariaLabel: "Rotate left", onclick: () => spin(-1) }),
        el("button", { className: "soft", textContent: "Stop", onclick: () => run("rotate", { velocity: 0 }, "rotate stop") }),

  }

  if (has("speaker")) {
    // Audio to the robot's speaker: binary 0x03 + sample rate (uint16 LE) + s16le mono,
    // over its own media socket. The robot plays 24 kHz; we resample here.
    const RATE = 24000;
    const spk = { ws: null, ready: null, talk: null };
    const info = el("div", { className: "muted stats" });
    const socket = () => {
      if (spk.ws && spk.ws.readyState <= 1) return spk.ready;
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/robots/${encodeURIComponent(c.id)}/media?video=0&audio=0`);
      spk.ws = ws;
      spk.ready = new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = () => reject(new Error("speaker socket failed")); });

    };
    const send = (f32) => {
      const msg = new Uint8Array(3 + f32.length * 2);
      msg[0] = 0x03; msg[1] = RATE & 0xff; msg[2] = RATE >> 8;
      const pcm = new DataView(msg.buffer, 3);
      for (let i = 0; i < f32.length; i++) pcm.setInt16(i * 2, Math.max(-1, Math.min(1, f32[i])) * 32767, true);
      if (spk.ws && spk.ws.readyState === 1) spk.ws.send(msg);

      if (from === RATE) return f32;
      const out = new Float32Array(Math.floor(f32.length * RATE / from));
      for (let i = 0; i < out.length; i++) {
        const x = i * from / RATE, j = Math.floor(x), t = x - j;

    const playSamples = async (f32) => {
      await socket();
      wakeIfBlank();
      const chunk = RATE / 10, start = performance.now();
      for (let i = 0; i < f32.length; i += chunk) {
        const ahead = (i / RATE) * 1000 - (performance.now() - start);
        if (ahead > 400) await new Promise((r) => setTimeout(r, ahead - 400));
        send(f32.subarray(i, i + chunk));
      }
    };
    const playFile = async (file) => {
      const buf = await new (window.AudioContext || window.webkitAudioContext)().decodeAudioData(await file.arrayBuffer());
      const off = new OfflineAudioContext(1, Math.ceil(buf.duration * RATE), RATE);
      const src = off.createBufferSource();
      src.buffer = buf;
      src.connect(off.destination);
      src.start();
      const f32 = (await off.startRendering()).getChannelData(0);
      info.textContent = `Playing ${file.name} (${buf.duration.toFixed(1)} s)`;
      await playSamples(f32);
      info.textContent = "";
    };
    const beep = () => {
      const f32 = new Float32Array(RATE * 0.3);
      for (let i = 0; i < f32.length; i++) f32[i] = 0.3 * Math.sin(2 * Math.PI * 880 * i / RATE) * Math.min(1, (f32.length - i) / 800);

    const startTalk = async () => {
      if (spk.talk || spk.starting) return;

        ctx.createMediaStreamSource(stream).connect(node);
        node.connect(ctx.destination); // required for onaudioprocess; the output stays silent
        spk.talk = { stream, ctx };
        info.textContent = "Talking through the robot…";
      } finally {
        spk.starting = false;
        talk.textContent = spk.talk ? "Stop talking" : "Talk";
      }
    };
    const stopTalk = () => {
      if (!spk.talk) return;
      spk.talk.stream.getTracks().forEach((t) => t.stop());
      spk.talk.ctx.close();
      spk.talk = null;
      talk.textContent = "Talk";
      info.textContent = "";
    };

      serverInfo.then((i) => {

  c.update = (r) => {

      : r.standby_until ? "standby until " + new Date(r.standby_until).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })

    c.meta.textContent = state + (r.model ? " · " + r.model : "");
    const keys = Object.keys(r.telemetry).filter((k) => !(k in SENSOR_LABELS)).sort();
    const sensorKeys = Object.keys(SENSOR_LABELS).filter((k) => k in r.telemetry);
    c.sensorHead.hidden = c.sensorTable.hidden = !sensorKeys.length;

    }
    if (c.usbWarn) c.usbWarn.hidden = !(r.telemetry.core_vbus_v > 1);
    if (c.proxLabel && "proximity_on" in r.telemetry) {

      const [label, unit] = SENSOR_LABELS[k];

    // Show the robot's reported value; follow it only when the user hasn't

      const reported = Math.round(r.telemetry[key]);
      if (s.showNow) s.now.textContent = `· now ${reported}${s.unit}`;
      if (Date.now() - s.touched > 4000) {

  };
  c.addEvent = (ev) => {
    // The server replays recent events on (re)connect; skip ones already shown.

      status.textContent = ev.name.replaceAll("_", " ") + ((ev.data || {}).reason ? ": " + ev.data.reason : "");
    }
    if (ev.name === "ir_received" && c.onIr) c.onIr(ev.data || {});
    if (ev.name === "nfc_tag" && c.onNfc) c.onNfc(ev.data || {});
    if (ev.name === "servers" && c.onServers) c.onServers(ev.data || {});
    const d = ev.data || {};
    const where = "x" in d ? ` (${d.x}, ${d.y})`
      : "manual" in d ? (d.manual ? " (manual)" : " (auto)")
      : "list" in d ? ` (${(() => { try { return JSON.parse(d.list).length; } catch { return "?"; } })()} servers)`
      : "reg" in d ? ` ${hex(d.reg)} = ${d.value < 0 ? "failed" : hex(d.value)}`
      : "press" in d ? ` (${d.press})`
      : "reason" in d ? `: ${d.reason}`
      : "seconds" in d ? ` (${d.seconds} s)`
      : "z0" in d ? ` (zones ${d.z0}·${d.z1}·${d.z2})`
      : "ms" in d ? ` (${d.ms} ms)`
      : "value" in d ? ` (${d.value})`
      : "protocol" in d ? (d.protocol === "nec" ? ` NEC ${hex(d.address)} / ${hex(d.command)}` : ` raw (${(d.raw || "").split(",").length} timings)`)
      : "uid" in d ? ` ${d.uid}` + (d.type ? ` (${d.type.replaceAll("_", " ")})` : "") + (d.text ? ` “${d.text}”` : "") + (d.mem ? ` · ${d.mem.length / 2} bytes read` : "")
      : "";
    c.events.unshift({ sent: false, text: new Date(ev.ts).toLocaleTimeString() + "  " + ev.name.replaceAll("_", " ") + where });
    c.events.length = Math.min(c.events.length, 40);
    c.renderEvents();
  };
  // All / Robot only / Sent only; the choice is kept in this browser.
  try { c.eventFilter.value = localStorage.getItem("stackchan-events-filter") || "all"; } catch { /* private mode */ }
  c.eventFilter.onchange = () => {
    try { localStorage.setItem("stackchan-events-filter", c.eventFilter.value); } catch { /* private mode */ }
    c.renderEvents();
  };
  c.renderEvents = () => {
    const f = c.eventFilter.value;
    const shown = c.events.filter((e) => f === "all" || (f === "sent") === e.sent).slice(0, 10);
    c.eventList.replaceChildren(...(shown.length ? shown.map((e) => el("li", { className: e.sent ? "sent" : "", textContent: e.text }))
      : [el("li", { className: "sent", textContent: "Nothing yet." })]));
  };
  return c;
}

function upsert(r) {
  let c = cards.get(r.id);
  if (!c) {
    c = makeCard(r);
    cards.set(r.id, c);
    const ids = [...cards.keys()].sort();
    list.replaceChildren(...ids.map((id) => cards.get(id).root));
  }
  c.robot = r;
  c.update(r);
  empty.hidden = cards.size > 0;
}

// Join requests (see server join.go): an unpaired browser asks, a paired one answers.
const joinBtn = document.getElementById("join");
const joinStatus = document.getElementById("joinStatus");
const joinsBox = document.getElementById("joins");
const joinBanners = new Map(); // request id -> banner
joinBtn.onclick = async () => {
  joinBtn.disabled = true;
  try {
    const res = await fetch("/api/join", { method: "POST" });
    if (!res.ok) throw new Error((await res.text()).trim());
    const j = await res.json();
    joinStatus.replaceChildren("Waiting for approval on the phone. Code: ", el("span", { className: "joincode", textContent: j.code }));
    setTimeout(() => {
      if (!cards.size) { joinStatus.textContent = "The request expired."; joinBtn.disabled = false; }
    }, Math.max(0, new Date(j.expires) - Date.now()));
  } catch (err) {
    joinStatus.textContent = err.message;
    joinBtn.disabled = false;
  }
};
document.getElementById("codeForm").onsubmit = (e) => {
  e.preventDefault();
  const code = document.getElementById("codeInput").value.trim();
  if (code) location.href = "/pair?code=" + encodeURIComponent(code);
};
const closeJoin = (id) => {
  const box = joinBanners.get(id);
  if (box) { box.remove(); joinBanners.delete(id); }
};
const showJoin = (j) => {
  if (joinBanners.has(j.id)) return;
  const note = el("div", { className: "muted" });
  const answer = async (decision) => {
    try {
      const res = await fetch(`/api/join/${encodeURIComponent(j.id)}/${decision}`, { method: "POST" });
      if (!res.ok) throw new Error((await res.text()).trim());
      closeJoin(j.id);
    } catch (err) {
      note.textContent = err.message;
    }
  };
  const box = el("div", { className: "joinreq" }, [
    el("div", { textContent: `${j.agent} at ${j.from} asks to control your robots.` }),
    el("div", { style: "margin-top:4px" }, ["Code: ", el("span", { className: "joincode", textContent: j.code })]),
    el("div", { className: "muted", style: "font-size:0.85rem", textContent: "Allow only if the browser you want to add shows the same code." }),
    el("div", { className: "row", style: "margin-top:8px" }, [
      el("button", { textContent: "Allow", onclick: () => answer("approve") }),
      el("button", { className: "soft", textContent: "Deny", onclick: () => answer("deny") }),
    ]),
    note,
  ]);
  joinBanners.set(j.id, box);
  joinsBox.append(box);
  setTimeout(() => closeJoin(j.id), Math.max(0, new Date(j.expires) - Date.now()));
};

function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("join_request", (ev) => showJoin(JSON.parse(ev.data)));
  es.addEventListener("join_closed", (ev) => closeJoin(JSON.parse(ev.data).id));
  es.addEventListener("join_result", (ev) => {
    if (JSON.parse(ev.data).status === "approved") {
      location.href = "/"; // paired now: reload, the robots come with the new stream
    } else {
      joinStatus.textContent = "The request was denied.";
      joinBtn.disabled = false;
    }
  });
  es.addEventListener("open", () => { connLine.textContent = "Live"; });
  es.addEventListener("robot", (ev) => upsert(JSON.parse(ev.data)));
  es.addEventListener("pong", (ev) => {
    const p = JSON.parse(ev.data);
    const pending = pendingPings.get(p.id);
    if (pending) {
      pendingPings.delete(p.id);
      pending.resolve({ ...p, total: performance.now() - pending.t0 });
    }
  });
  es.addEventListener("robot_event", (ev) => {
    const e = JSON.parse(ev.data);
    const c = cards.get(e.robot);
    if (c) c.addEvent(e);
  });
  es.addEventListener("snapshot", (ev) => {
    const e = JSON.parse(ev.data);
    const c = cards.get(e.robot);
    if (c && c.onSnapshot) c.onSnapshot(e);
  });
  es.addEventListener("command_sent", (ev) => {
    const e = JSON.parse(ev.data);
    const c = cards.get(e.robot);
    if (c) c.addEvent(e);
  });
  es.addEventListener("error", () => { connLine.textContent = "Reconnecting…"; });
}

empty.hidden = false;
connect();
// Refresh "seen … ago" for offline robots.
setInterval(() => { for (const c of cards.values()) if (c.robot && !c.robot.online) c.update(c.robot); }, 5000);
</script>
